name: New Showcase Tool
description: Add a new tool or engine entry in Showcase > Tools.
title: "Tool: "
labels: ["tools"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for engines, editors, and production tools.

  - type: dropdown
    id: submission_type
    attributes:
      label: Submission type
      options:
        - Tools
    validations:
      required: true

  - type: input
    id: project_title
    attributes:
      label: Project title
      description: Name of the tool.
      placeholder: "Nostr Game Engine"
    validations:
      required: true

  - type: input
    id: tool_type
    attributes:
      label: Tool type
      description: Tool category to display in the badge (for example Engine, Tool, Editor).
      placeholder: "Engine"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: One-liner shown in listing cards.
      placeholder: "A short one-line description."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: Full project description for the detail page.
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Comma-separated list (for example: editor, pipeline, engine)."

  - type: input
    id: platforms
    attributes:
      label: Platforms
      description: "Comma-separated list (for example: Windows, Linux, Mac)."

  - type: input
    id: icon
    attributes:
      label: FontAwesome icon
      description: Optional class without the `fa-` prefix (for example `cubes`).
      placeholder: "cubes"

  - type: input
    id: external_link
    attributes:
      label: Project page link

  - type: input
    id: github_link
    attributes:
      label: GitHub link

  - type: input
    id: indiedb_link
    attributes:
      label: IndieDB link

  - type: input
    id: website_link
    attributes:
      label: Website link

  - type: textarea
    id: screenshot_urls
    attributes:
      label: Screenshots
      description: "Drag images here, paste screenshots, or add one public image URL per line."
      placeholder: "Drag or paste images here."
    validations:
      required: true

  - type: input
    id: weight
    attributes:
      label: Weight
      description: Optional numeric weight for ordering.
      placeholder: "20"
