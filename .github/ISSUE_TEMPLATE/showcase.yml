name: New Showcase Game
description: Add a full showcase project entry with screenshots and links.
title: "Showcase: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for games and playable projects.

  - type: dropdown
    id: submission_type
    attributes:
      label: Submission type
      options:
        - Showcase
    validations:
      required: true

  - type: input
    id: project_title
    attributes:
      label: Project title
      description: Name of the game/project.
      placeholder: "My JME Game"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: One-liner shown in listing cards.
      placeholder: "A short one-line description."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: Full project description for the detail page.
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Authors
      description: Comma-separated list.
      placeholder: "Alice, Bob"

  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Comma-separated list of tags (for example: sandbox, strategy, indie, steam)."

  - type: input
    id: platforms
    attributes:
      label: Platforms
      description: "Comma-separated list (for example: Windows, Linux, Mac, Android)."

  - type: input
    id: steam_link
    attributes:
      label: Steam link

  - type: input
    id: itch_link
    attributes:
      label: Itch link

  - type: input
    id: indiedb_link
    attributes:
      label: IndieDB link

  - type: input
    id: publisher_link
    attributes:
      label: Website link

  - type: textarea
    id: screenshot_urls
    attributes:
      label: Screenshots
      description: "Drag images here, paste screenshots, or add one public image URL per line."
      placeholder: "Drag or paste images here."
    validations:
      required: true

  - type: dropdown
    id: featured
    attributes:
      label: Feature this project
      options:
        - "false"
        - "true"
    validations:
      required: true

  - type: input
    id: featured_from
    attributes:
      label: Featured from
      description: Optional start date (YYYY-MM-DD).

  - type: input
    id: featured_to
    attributes:
      label: Featured to
      description: Optional end date (YYYY-MM-DD).
