name: Showcase Entry
description: Add a game, app, tool, editor, or engine to the showcase.
title: "Showcase: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for community games, apps, tools, editors, and engines.

  - type: dropdown
    id: submission_type
    attributes:
      label: Entry type
      options:
        - Game or app
        - Tool, editor, or engine
    validations:
      required: true

  - type: input
    id: project_title
    attributes:
      label: Project title
      description: Name of the project.
      placeholder: "My jMonkeyEngine project"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: One-liner shown in listing cards.
      placeholder: "A short one-line description."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: Full project description for the detail page.
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Authors
      description: Comma-separated list.
      placeholder: "Alice, Bob"

  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Comma-separated list of tags (for example: sandbox, strategy, editor, engine)."

  - type: input
    id: platforms
    attributes:
      label: Platforms
      description: "Comma-separated list (for example: Windows, Linux, Mac, Android)."

  - type: input
    id: steam_link
    attributes:
      label: Steam link

  - type: input
    id: itch_link
    attributes:
      label: Itch link

  - type: input
    id: indiedb_link
    attributes:
      label: IndieDB link

  - type: input
    id: publisher_link
    attributes:
      label: Website link

  - type: input
    id: github_link
    attributes:
      label: GitHub link

  - type: textarea
    id: cover_image
    attributes:
      label: Cover image
      description: "Drag or paste the image to use as the showcase cover."
      placeholder: "Drag or paste the cover image here."
    validations:
      required: true

  - type: textarea
    id: screenshot_urls
    attributes:
      label: Screenshots and videos
      description: "Drag images/videos here, paste media, or add one public media URL per line. WebM is kept, WebP is kept, GIF is converted to WebM, other images are converted to WebP."
      placeholder: "Drag or paste screenshots and videos here."
    validations:
      required: true
