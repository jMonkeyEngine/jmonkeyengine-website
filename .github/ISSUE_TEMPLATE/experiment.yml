name: Experiment
description: Add a community experiment screenshot and import it automatically.
title: "Experiment: "
labels: ["experiment"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to submit an experiment screenshot that will be inserted into the showcase experiments gallery.

  - type: dropdown
    id: submission_type
    attributes:
      label: Submission type
      options:
        - Experiment
    validations:
      required: true

  - type: input
    id: project_title
    attributes:
      label: Project title
      description: Name of the experiment.
      placeholder: "My JME Experiment"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Description shown with the experiment.

  - type: textarea
    id: screenshot_urls
    attributes:
      label: Screenshots and videos
      description: "Drag images/videos here, paste media, or add one public media URL per line. WebM is kept, WebP is kept, GIF is converted to WebM, other images are converted to WebP."
      placeholder: "Drag or paste screenshots and videos here."
    validations:
      required: true

  - type: input
    id: project_link
    attributes:
      label: Project link
      description: Optional link to the project page.
