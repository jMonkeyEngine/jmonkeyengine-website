<script>
document.addEventListener('DOMContentLoaded', function () {
    const STAR_REPO_STORAGE_KEY = 'jme-star-repo-highlighted';
    const button = document.querySelector('.menu-toggle');
    const menu = document.getElementById('site-menu');
    const starRepoButtons = Array.from(document.querySelectorAll('.star-repo-memory'));
    const applyStarRepoState = function (active) {
        starRepoButtons.forEach(function (starRepoButton) {
            starRepoButton.classList.toggle('star-repo-memory--active', active);
            if (starRepoButton.classList.contains('star-repo-btn')) {
                starRepoButton.classList.toggle('star-repo-btn--active', active);
            }
        });
    };
    try {
        if (localStorage.getItem(STAR_REPO_STORAGE_KEY) === '1') {
            applyStarRepoState(true);
        }
    } catch (_) {
        // storage unavailable; fallback to stateless behavior
    }

    const setOpen = function (open) {
        menu.classList.toggle('is-open', open);
        button.classList.toggle('is-open', open);
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        button.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
    };

    const clearStarRepoPersistedState = function () {
        try {
            localStorage.removeItem(STAR_REPO_STORAGE_KEY);
        } catch (_) {
            // storage unavailable; nothing to clear
        }
        applyStarRepoState(false);
    };

    if (starRepoButtons.length) {
        starRepoButtons.forEach(function (starRepoButton) {
            starRepoButton.addEventListener('click', function () {
                try {
                    localStorage.setItem(STAR_REPO_STORAGE_KEY, '1');
                } catch (_) {
                    // ignore storage failures
                }
                applyStarRepoState(true);
            });
            starRepoButton.addEventListener('pointerdown', function (event) {
                if (event && (event.button === 2 || event.which === 3)) {
                    event.preventDefault();
                    clearStarRepoPersistedState();
                }
            });
            starRepoButton.addEventListener('contextmenu', function (event) {
                event.preventDefault();
                clearStarRepoPersistedState();
            });
        });
    }

    if (!button || !menu) {
        return;
    }

    button.addEventListener('click', function (event) {
        event.stopPropagation();
        setOpen(!menu.classList.contains('is-open'));
    });
    menu.addEventListener('click', function (event) {
        if (event.target.closest('a')) setOpen(false);
    });
    document.addEventListener('click', function (event) {
        if (!menu.contains(event.target) && !button.contains(event.target)) setOpen(false);
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') setOpen(false);
    });
});
</script>
