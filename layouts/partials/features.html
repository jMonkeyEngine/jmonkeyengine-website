{{ $items := .Site.Data.features | default (slice) }}

<div class="features-grid">
  {{ range $items }}
  {{ $status := .status | default "" }}
  <article class="feature-card{{ if $status }} feature-card--pending{{ end }}">
    <div class="feature-icon">
      <i class="{{ .icon }}"></i>
    </div>
    <div class="feature-body">
      <h3 class="feature-title">{{ .title }}</h3>
      <p class="feature-desc">{{ .desc }}</p>
      <div class="feature-tags">
        {{ range .tags }}
        <span class="feature-tag">{{ . }}</span>
        {{ end }}
      </div>
      {{ with $status }}
      <p class="feature-status">{{ . }}</p>
      {{ end }}
    </div>
  </article>
  {{ end }}
</div>
