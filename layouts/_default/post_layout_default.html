{{ define "main" }}
{{ partial "page-hero.html" . }}

<section class="page-content">
    <div class="section-container">
        <article class="content-article{{ if eq .RelPermalink "/start/" }} content-article--start{{ end }}{{ if or (eq .RelPermalink "/contact/") (eq .RelPermalink "/donate/") }} content-article--special{{ end }}{{ if eq .RelPermalink "/contact/" }} content-article--contact{{ end }}{{ if eq .RelPermalink "/donate/" }} content-article--donate{{ end }}">
            <header class="article-header">
                {{ if .Params.icon }}<i class="{{ .Params.icon }} article-icon"></i>{{ end }}
                <h1>{{ .Title }}</h1>
                {{ with .Description }}<p class="article-description">{{ . }}</p>{{ end }}
            </header>
            <div class="article-body">
                {{ .Content }}
            </div>
            {{ if not .Params.disable_nav }}
                {{ partial "articleNavPost.html" . }}
            {{ end }}
        </article>
    </div>
</section>

{{ partial "comments.html" . }}

{{ end }}
